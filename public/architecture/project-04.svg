<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Logimate ERP architecture: Figma and Storybook as the shared design reference, shared custom hooks feeding fulfillment screens, a gradual JS to TypeScript migration, and the initiatives led from requirements to implementation">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#94a3b8" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1000" height="420" rx="24" fill="#f8fafc"/>
  <text x="36" y="40" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">LOGIMATE ERP · ONE REFERENCE, MANY SCREENS</text>

  <path d="M253 122H273" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M490 122H510" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M727 122H747" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">

    <text x="574" y="258">shared custom hooks</text>
  </g>

  <rect x="36" y="306" width="928" height="88" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="56" y="332" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">LED FROM REQUIREMENTS TO IMPLEMENTATION</text>

  <g font-family="Arial,sans-serif" fill="#0f172a">
    <text x="56" y="106" font-size="15" font-weight="700">Dynamic route</text>
    <text x="56" y="128" font-size="12" fill="#475569">/app/:screenUrl/:tabUrl</text>
    <text x="56" y="147" font-size="12" fill="#475569">one route, 30 screens</text>

    <text x="293" y="106" font-size="15" font-weight="700">Registries</text>
    <text x="293" y="128" font-size="12" fill="#475569">renderKey = screen_tab</text>
    <text x="293" y="147" font-size="12" fill="#475569">renderer 30 · api 27 · grid</text>

    <text x="530" y="106" font-size="15" font-weight="700">FSD · 6 layers</text>
    <text x="530" y="128" font-size="12" fill="#475569">app → pages → widgets</text>
    <text x="530" y="147" font-size="12" fill="#475569">features → entities → shared</text>

    <text x="767" y="106" font-size="15" font-weight="700">State · 3 tiers</text>
    <text x="767" y="128" font-size="12" fill="#475569">Zustand 10 stores</text>
    <text x="767" y="147" font-size="12" fill="#475569">Context 3 · TanStack Query</text>

    <text x="56" y="230" font-size="15" font-weight="700">Screen assembly</text>
    <text x="56" y="252" font-size="12" fill="#475569">PageInteraction store per renderKey</text>
    <text x="56" y="271" font-size="12" fill="#475569">TypedEmitter: row · cell · action</text>

    <text x="372" y="230" font-size="15" font-weight="700">UI system</text>
    <text x="372" y="252" font-size="12" fill="#475569">Radix UI + vanilla-extract + Tailwind 4</text>
    <text x="372" y="271" font-size="12" fill="#475569">AG Grid 35 · portal cell editor</text>

    <text x="688" y="230" font-size="15" font-weight="700">API layer</text>
    <text x="688" y="252" font-size="12" fill="#475569">one axios client · 1s duplicate guard</text>
    <text x="688" y="271" font-size="12" fill="#475569">refresh: Web Locks + BroadcastChannel</text>
  </g>

  <rect x="36" y="306" width="928" height="88" rx="16" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>

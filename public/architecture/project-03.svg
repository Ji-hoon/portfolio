<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="Moviq AI Light architecture: one dynamic route composing a renderKey, registries resolving renderer and API and grid and labeling, six-layer Feature-Sliced Design, three state tiers, screen assembly, UI system, API layer, and a seven-agent development pipeline">

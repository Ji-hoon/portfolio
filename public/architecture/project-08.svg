<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 320" role="img" aria-label="엘리스트랙 팀 프로젝트 아키텍처. React 클라이언트가 GCP VM 위의 Express API로 요청을 보내고, Express API는 MongoDB에 데이터를 저장한다. 카카오 동의, 콜백 프로필 조회, 사용자 upsert, JWT 발급으로 이어지는 소셜 로그인 흐름을 함께 표시한다.">
  <style>
    .d-box { fill: #ffffff; stroke: rgba(15, 20, 27, 0.11); stroke-width: 1.25; }
    .d-box-acc { fill: rgba(17, 70, 182, 0.07); stroke: rgba(17, 70, 182, 0.28); stroke-width: 1.25; }
    .d-box-ext { fill: rgba(15, 122, 107, 0.09); stroke: #0f7a6b; stroke-width: 1.1; }
    .d-t { fill: #0f141b; font-family: Arial, "Apple SD Gothic Neo", sans-serif; font-size: 13px; font-weight: 650; letter-spacing: -0.01em; }
    .d-s { fill: #3b4552; font-family: Arial, "Apple SD Gothic Neo", sans-serif; font-size: 11.5px; }
    .d-l { fill: #737e8d; font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10.5px; letter-spacing: 0.02em; }
    .d-la { fill: #1146b6; font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10.5px; font-weight: 500; }
    .d-cap { fill: #737e8d; font-family: "SFMono-Regular", Menlo, Consolas, monospace; font-size: 10px; letter-spacing: 0.09em; }
    .d-ln { stroke: #3b4552; stroke-width: 1.3; fill: none; }
    .d-ln-a { stroke: #1146b6; stroke-width: 1.6; fill: none; }
    .d-div { stroke: rgba(15, 20, 27, 0.11); stroke-width: 1; }
    .d-vm { fill: none; stroke: rgba(15, 20, 27, 0.22); stroke-width: 1.1; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 8" refX="6.5" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#3b4552" />
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 8" refX="6.5" refY="4" markerWidth="4" markerHeight="4" orient="auto">
      <polygon points="0 0, 10 4, 0 8" fill="#1146b6" />
    </marker>
  </defs>

  <text class="d-cap" x="16" y="18">클라이언트</text>
  <text class="d-cap" x="654" y="18">외부 API</text>

  <!-- kakao consent: client → kakao, over the top -->
  <path class="d-ln-a" d="M121 118 L 121 54 Q 121 40 135 40 L 745 40 Q 759 40 759 54 L 759 84" marker-end="url(#arrow-accent)" />
  <text class="d-la" x="440" y="33" text-anchor="middle">① 카카오 로그인 · 동의</text>

  <!-- client -->
  <rect class="d-box" x="16" y="118" width="210" height="76" rx="4" />
  <text class="d-t" x="30" y="142">React client</text>
  <text class="d-s" x="30" y="162">로그인 · 장소 검색 · 공통 UI</text>

  <!-- gcp vm -->
  <rect class="d-vm" x="300" y="56" width="264" height="252" rx="6" />
  <text class="d-cap" x="314" y="76">GCP VM — 빌드 · 배포 · 운영</text>

  <rect class="d-box-acc" x="316" y="90" width="232" height="118" rx="4" />
  <text class="d-t" x="330" y="112">Express API</text>
  <text class="d-s" x="330" y="132">사용자 · 관리자 인증</text>
  <text class="d-s" x="330" y="150">장소 · 태깅 API</text>
  <line class="d-div" x1="330" y1="162" x2="534" y2="162" />
  <text class="d-la" x="330" y="184">팀 전원이 의존하는 공용 API</text>

  <rect class="d-box" x="316" y="232" width="232" height="64" rx="4" />
  <text class="d-t" x="330" y="254">MongoDB</text>
  <text class="d-s" x="330" y="272">사용자 · 역할 · 장소 · 태그 저장</text>

  <!-- external -->
  <rect class="d-box-ext" x="654" y="90" width="210" height="76" rx="4" />
  <text class="d-t" x="668" y="114">Kakao API</text>
  <text class="d-s" x="668" y="134">소셜 로그인 — 동의 · 프로필</text>
  <text class="d-s" x="668" y="152">회원가입 플로우 간소화</text>

  <!-- flows -->
  <path class="d-ln" d="M226 150 L 308 150" marker-end="url(#arrow)" />
  <text class="d-l" x="271" y="142" text-anchor="middle">API 요청</text>

  <path class="d-ln-a" d="M654 128 L 556 128" marker-end="url(#arrow-accent)" />
  <text class="d-la" x="601" y="120" text-anchor="middle">② 콜백 · 프로필</text>

  <path class="d-ln-a" d="M432 208 L 432 224" marker-end="url(#arrow-accent)" />
  <text class="d-la" x="444" y="222">③ 사용자 upsert</text>

  <path class="d-ln-a" d="M316 176 L 234 176" marker-end="url(#arrow-accent)" />
  <text class="d-la" x="271" y="192" text-anchor="middle">④ JWT 발급</text>
</svg>

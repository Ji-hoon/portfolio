<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-label="In-house document RAG architecture: build-time bundle chunked and idempotently ingested, an asynchronous embedding worker, a lexical and a vector axis fused by rank-only RRF into the top five chunks, and three overlapping exposure boundaries">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 0 10 5 0 10Z" fill="#334155"/></marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#94a3b8" flood-opacity=".18"/></filter>
  </defs>
  <rect width="1000" height="420" rx="24" fill="#f8fafc"/>
  <text x="36" y="40" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2" fill="#64748b">IN-HOUSE DOC RAG · TWO AXES, NO NEW INFRASTRUCTURE</text>

  <g font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#94a3b8">
    <text x="36" y="66">INGEST · BUILD-TIME BUNDLE</text>
    <text x="36" y="192">SEARCH · ONE ENTRY POINT</text>
  </g>

  <path d="M253 120H273" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M490 120H510" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M727 120H747" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="36" y="76" width="217" height="88" rx="16" fill="#e0e7ff" stroke="#4f46e5" stroke-width="2"/>
    <rect x="273" y="76" width="217" height="88" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="510" y="76" width="217" height="88" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <rect x="747" y="76" width="217" height="88" rx="16" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  </g>

  <g font-family="Arial,sans-serif" fill="#0f172a">
    <text x="56" y="104" font-size="15" font-weight="700">Bundled docs</text>
    <text x="56" y="126" font-size="12" fill="#475569">82 markdown files</text>
    <text x="56" y="145" font-size="12" fill="#475569">no CMS, no runtime FS</text>

    <text x="293" y="104" font-size="15" font-weight="700">Chunker</text>
    <text x="293" y="126" font-size="12" fill="#475569">heading · 800 tokens</text>
    <text x="293" y="145" font-size="12" fill="#475569">1,321 chunks + breadcrumb</text>

    <text x="530" y="104" font-size="15" font-weight="700">Idempotent upsert</text>
    <text x="530" y="126" font-size="12" fill="#475569">content_hash diff</text>
    <text x="530" y="145" font-size="12" fill="#475569">embedding = NULL, commit</text>

    <text x="767" y="104" font-size="15" font-weight="700">Embed worker</text>
    <text x="767" y="126" font-size="12" fill="#475569">claim TTL 10m · 768d L2</text>
    <text x="767" y="145" font-size="12" fill="#475569">1,259 vectors · 3,072B</text>
  </g>

  <path d="M326 234H341V262H356" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M326 310H341V282H356" fill="none" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M546 272H566" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M756 272H776" stroke="#334155" stroke-width="3" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)">
    <rect x="36" y="202" width="290" height="64" rx="14" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
    <rect x="36" y="278" width="290" height="64" rx="14" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
    <rect x="356" y="228" width="190" height="88" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
    <rect x="566" y="228" width="190" height="88" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <rect x="776" y="228" width="188" height="88" rx="16" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  </g>

  <g font-family="Arial,sans-serif" fill="#0f172a">
    <text x="56" y="228" font-size="14" font-weight="700">Lexical axis</text>
    <text x="56" y="248" font-size="11.5" fill="#475569">translation backstop + generic strip</text>

    <text x="56" y="304" font-size="14" font-weight="700">Vector axis</text>
    <text x="56" y="324" font-size="11.5" fill="#475569">raw query · LRU 256 · brute force</text>

    <text x="376" y="258" font-size="15" font-weight="700">RRF k=60</text>
    <text x="376" y="280" font-size="12" fill="#475569">rank-only fusion</text>
    <text x="376" y="299" font-size="12" fill="#475569">top 20 + top 20</text>

    <text x="586" y="258" font-size="15" font-weight="700">Top 5 chunks</text>
    <text x="586" y="280" font-size="12" fill="#475569">bodies re-fetched</text>
    <text x="586" y="299" font-size="12" fill="#475569">by chunk id</text>

    <text x="796" y="258" font-size="15" font-weight="700">Grounded answer</text>
    <text x="796" y="280" font-size="12" fill="#475569">citations: ko only</text>
    <text x="796" y="299" font-size="12" fill="#475569">0 hits is valid</text>
  </g>

  <text x="356" y="336" font-family="Arial,sans-serif" font-size="11" fill="#64748b">vector axis fails or holder empty → lexical axis alone</text>

  <rect x="36" y="352" width="928" height="44" rx="14" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="2"/>
  <text x="56" y="379" font-family="Arial,sans-serif" font-size="11" font-weight="700" letter-spacing="1.5" fill="#64748b">EXPOSURE ×3</text>
  <text x="160" y="379" font-family="Arial,sans-serif" font-size="12" fill="#475569">bundle exclude 13 files · embed allowlist is fail-closed (empty by default) · scope guardrail in the system prompt</text>
</svg>
